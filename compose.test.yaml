services:
  dolphin-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    command: ["server"]
    environment:
      HOME: /var/lib/dolphin/home
      XDG_CONFIG_HOME: /var/lib/dolphin/config
      XDG_STATE_HOME: /var/lib/dolphin/state
      XDG_CACHE_HOME: /var/lib/dolphin/cache
      XDG_RUNTIME_DIR: /var/lib/dolphin/runtime
      HERDR_CONFIG_PATH: /var/lib/dolphin/config/herdr/config.toml
      HERDR_SESSION: docker-proof
      DOLPHIN_AGENT_COMMAND: python3 /usr/local/bin/fake-agent.py
      HERDR_SOCKET_PATH: /var/lib/dolphin/config/herdr/sessions/docker-proof/herdr.sock
    volumes:
      - ./scripts/docker/dolphin-test-entrypoint:/usr/local/bin/dolphin-test-entrypoint:ro
      - ./scripts/docker/fake-agent.py:/usr/local/bin/fake-agent.py:ro
      - ./plugins/dolphin-board:/opt/dolphin-board:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/dolphin", "--session", "docker-proof", "status", "server"]
      interval: 1s
      timeout: 2s
      retries: 60

volumes:
  dolphin-test-state:
